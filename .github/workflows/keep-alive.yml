name: Keep Supabase Alive

on:
  schedule:
    - cron: "0 8 */5 * *"   # every 5 days at 08:00 UTC
  workflow_dispatch:          # allow manual trigger from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health (keeps Supabase DB active)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.PROD_API_URL }}/system/health")
          echo "Health check status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Warning: API returned $STATUS"
            exit 1
          fi
